<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>docsify-screenreader</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'docsify-screenreader',
      loadSidebar: true,
      subMaxLevel: 3,

      screenreader: {
        position: 'bottom-right',
        lang: 'en',
        readCode: false
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5"></script>
  <script src="./docsify-screenreader.min.js"></script>
</body>
</html>
